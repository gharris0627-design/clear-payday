      catch (err) { msg.className = "msg bad"; msg.textContent = "That code didn't work. Make sure you pasted the whole thing, starting with CP1:"; }
    }
  });

  view.addEventListener("change", e => {
    const t = e.target;
    if (t.type === "checkbox") {
      if (t.dataset.ci) {
        const k = t.dataset.ci;
        if (k.startsWith("b:")) { const bk = k.slice(2); if (t.checked) state.paid[bk] = true; else delete state.paid[bk]; }
        else { const c = state.checkins[ciKey] = state.checkins[ciKey] || { done: {} }; c.done = c.done || {}; if (t.checked) c.done[k] = true; else delete c.done[k]; }
        touched(); render(); refocus(t.id); return;
      }
      if (t.id === "smooth") { state.smooth = t.checked; touched(); return; }
      const card = t.closest("[data-inc]");
      if (card) {
        const inc = state.incomes.find(i => i.id === card.dataset.inc); if (!inc) return;
        if (t.dataset.i === "variable") inc.variable = t.checked;
        if (t.dataset.i === "changing") inc.change = t.checked ? { freq: inc.freq === "monthly" ? "biweekly" : "monthly", pay: inc.pay || 0, date: "", semiA: 1, semiB: 15 } : null;
        touched(); render(); refocus(t.id); return;
      }
      return;
    }
    if (t.dataset.actInc) {
      const inc = state.incomes.find(i => i.id === t.dataset.actInc); if (!inc) return;
      inc.actuals = inc.actuals || {};
      if (t.value === "") delete inc.actuals[ciKey]; else inc.actuals[ciKey] = parseFloat(t.value) || 0;
      touched(); render(); return;
    }
  });

  view.addEventListener("input", e => {
    const t = e.target;
    if (t.type === "checkbox" || t.dataset.actInc) return;
    const card = t.closest("[data-inc]");
    if (card) {
      const inc = state.incomes.find(i => i.id === card.dataset.inc); if (!inc) return;
      if (t.dataset.i) {
        const f = t.dataset.i;
        inc[f] = f === "pay" ? (parseFloat(t.value) || 0) : (f === "semiA" || f === "semiB") ? +t.value : t.value;
        touched();
        if (f === "freq") { render(); refocus(t.id); return; }
      } else if (t.dataset.c && inc.change) {
        const f = t.dataset.c;
        inc.change[f] = f === "pay" ? (parseFloat(t.value) || 0) : (f === "semiA" || f === "semiB") ? +t.value : t.value;
        touched();
        if (f === "freq") { render(); refocus(t.id); return; }
      }
      const pm = document.getElementById("payMonthly"); if (pm) pm.textContent = money(incomeMonthlyBase());
      return;
    }
    if (t.name === "cushion") state.cushion = +t.value;
    else if (t.name === "split") state.split = t.value;
    else if (t.dataset.f) {
      const row = t.closest(".erow"); if (!row) return;
      const list = row.closest(".bills-ed") ? state.bills : row.closest(".spend-ed") ? state.spend : state.goals;
      const item = list.find(x => x.id === row.dataset.id); if (!item) return;
      const f = t.dataset.f;
      item[f] = (f === "amt" || f === "target") ? (parseFloat(t.value) || 0) : f === "day" ? +t.value : t.value;
      if (list === state.bills && f === "freq") {
        if (item.freq !== "monthly" && !parse(item.due)) {
          const day = Math.max(1, item.day | 0);
          let d = new Date(today.getFullYear(), today.getMonth(), Math.min(day, dim(today.getFullYear(), today.getMonth())));
          if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, Math.min(day, dim(today.getFullYear(), today.getMonth() + 1)));
          item.due = iso(d);
        }
        if (item.freq === "monthly" && parse(item.due)) item.day = parse(item.due).getDate();
        touched(); render(); refocus(t.id); return;
      }
      if (list === state.bills && f === "due" && parse(item.due)) item.day = parse(item.due).getDate();
      if (list === state.goals) {
        if (f === "kind") { touched(); render(); refocus(t.id); return; }
        const auto = isPlanned(item) && +item.target > 0 && monthsUntil(item.by);
        const amtEl = document.getElementById("goal-amt-" + item.id);
        if (amtEl && t !== amtEl) { amtEl.readOnly = !!auto; if (auto) amtEl.value = goalMonthly(item); }
        const calc = document.getElementById("goal-calc-" + item.id);
        if (calc) calc.textContent = auto ? `${money(goalMonthly(item))}/mo for ${monthsUntil(item.by)} mo` : "";
      }
    } else return;
    touched();
    const bt = document.getElementById("billTotal"); if (bt) bt.textContent = money(billsMonthlyAll());
    const st = document.getElementById("spendTotal"); if (st) st.textContent = money(spendMonthlyOf());
    const gt = document.getElementById("goalTotal"); if (gt) gt.textContent = money(goalsMonthlyOf());
    const sb = document.getElementById("suggestBody"); if (sb) sb.innerHTML = suggestBody();
  });

  render();
})();
</script>
