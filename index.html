<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clear Payday: plan every paycheck. See what to reserve for bills, what goes to goals, and what's safe to spend.">
<meta name="theme-color" content="#0D6A4C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D6A4C'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='bold' font-size='16' text-anchor='middle' fill='white'%3E$%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Clear Payday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: pay-stub hero for the next check, then a stack of upcoming paychecks; setup lives in tabs. */
:root {
  --bg: #ECF1EF; --surface: #FFFFFF; --sunk: #F5F8F7; --ink: #13201C; --muted: #566762; --line: #D3DDD9;
  --accent: #0D6A4C; --accent-ink: #FFFFFF; --accent-soft: #DCEEE6;
  --bills: #34557D; --living: #8A4C97; --goals: #B9821A; --spend: #0D6A4C;
  --warn: #A9480F; --warn-soft: #FBE7D9;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1614; --surface: #16211E; --sunk: #111A18; --ink: #E4EDEA; --muted: #92A49F; --line: #283732;
  --accent: #4BC293; --accent-ink: #0B1512; --accent-soft: #163A2D;
  --bills: #86A9D4; --living: #C792D3; --goals: #E2B24E; --spend: #4BC293;
  --warn: #F29A62; --warn-soft: #3A2417; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1614; --surface: #16211E; --sunk: #111A18; --ink: #E4EDEA; --muted: #92A49F; --line: #283732;
  --accent: #4BC293; --accent-ink: #0B1512; --accent-soft: #163A2D;
  --bills: #86A9D4; --living: #C792D3; --goals: #E2B24E; --spend: #4BC293;
  --warn: #F29A62; --warn-soft: #3A2417; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
main { min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.label { font: 500 11px/1.2 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 28px; font-weight: 800; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 2px 0 0; }
nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; overflow-x: auto; max-width: 100%; }
nav button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
.banner .row { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }

/* Pay stub hero */
.stub { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: 1.1fr 1fr; overflow: hidden; }
.stub-main { padding: 22px; display: grid; gap: 6px; align-content: start; }
.stub-main .big { font: 800 clamp(40px, 9vw, 60px)/1 var(--f-display); color: var(--spend); letter-spacing: -0.02em; }
.stub-main .big.short { color: var(--warn); }
.stub-main .sub { color: var(--muted); }
.stub-lines { padding: 22px; border-left: 2px dashed var(--line); background: var(--sunk); display: grid; gap: 10px; align-content: start; }
.line-row { display: flex; justify-content: space-between; gap: 12px; }
.line-row b { font-weight: 600; }
.line-row.total { border-top: 1px solid var(--line); padding-top: 10px; font-weight: 700; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 8px; vertical-align: 1px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--f-body); padding: 5px 9px; border-radius: 999px; width: fit-content; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.bad { background: var(--warn-soft); color: var(--warn); }

/* Sections */
.section { display: grid; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 20px; font-weight: 700; }

.attn { display: grid; gap: 8px; }
.attn-item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 10px 12px; }
.attn-item.info { border-left-color: var(--bills); }
.attn-item .tag { font: 500 11px/1.6 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); }
.attn-item.info .tag { color: var(--bills); }
.all-clear { color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }

.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.check { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.check-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.check-top h3 { font-size: 18px; font-weight: 700; }
.check-top .amt { text-align: right; }
.check-top .amt b { display: block; font: 700 20px/1.1 var(--f-display); }
.check-top .amt b.short { color: var(--warn); }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--sunk); }
.bar span { display: block; height: 100%; }
.bar .over { background: repeating-linear-gradient(135deg, var(--warn) 0 4px, transparent 4px 8px); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.bill-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.bill-list li { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; }
.bill-list .d { font: 500 12px/1.7 var(--f-mono); color: var(--muted); }
.bill-list .none { color: var(--muted); grid-template-columns: 1fr; }

.month { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.month div { padding: 14px 16px; display: grid; gap: 4px; background: var(--surface); }
.month b { font: 700 22px/1.1 var(--f-display); }

/* Editors */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 18px; }
.panel h2 { font-size: 22px; font-weight: 700; }
.panel > p { margin: -10px 0 0; color: var(--muted); max-width: 62ch; }
.field { display: grid; gap: 6px; }
.field label, .field .label { font-weight: 600; font-size: 14px; color: var(--ink); text-transform: none; letter-spacing: 0; font-family: var(--f-body); }
.field .hint { font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], input[type=date], select, textarea {
  background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
.money { position: relative; }
.money::before { content: "$"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.money input { padding-left: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.chips input:checked + label { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.rows { display: grid; gap: 8px; }
.rowhead, .erow { display: grid; gap: 8px; align-items: center; }
.bills-ed .rowhead, .bills-ed .erow { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 90px 40px; }
.goals-ed .rowhead, .goals-ed .erow, .spend-ed .rowhead, .spend-ed .erow { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) 40px; }
.del { border: 1px solid var(--line); background: transparent; border-radius: 8px; height: 38px; color: var(--muted); font-size: 18px; line-height: 1; }
.del:hover { color: var(--warn); border-color: var(--warn); }
.ed-foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.ed-foot .sum { color: var(--muted); }
.ed-foot .sum b { color: var(--ink); }

.target { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.target .money { flex: 0 1 140px; }
.target input[type=month] { flex: 0 1 180px; width: auto; }
.target .calc { color: var(--ink); font-weight: 600; }
input[readonly] { opacity: .7; }
.suggest { background: var(--accent-soft); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.suggest h3 { font-size: 17px; font-weight: 700; }
.suggest .chips label { padding: 6px 12px; font-size: 13px; background: var(--surface); }
.suggest .opts { display: grid; gap: 10px; }
.suggest .opt { display: grid; gap: 6px; }
.suggest .lines { display: grid; gap: 8px; background: var(--surface); border-radius: 8px; padding: 12px 14px; }
.suggest .warn { color: var(--warn); font-weight: 600; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; display: grid; gap: 10px; justify-items: start; }
textarea { min-height: 96px; font: 12px/1.4 var(--f-mono); resize: vertical; word-break: break-all; }
.note { font-size: 13px; color: var(--muted); }
.msg { font-size: 14px; font-weight: 600; }
.msg.ok { color: var(--accent); } .msg.bad { color: var(--warn); }
footer { color: var(--muted); font-size: 13px; text-align: center; }

@media (max-width: 720px) {
  .stub { grid-template-columns: 1fr; }
  .stub-lines { border-left: 0; border-top: 2px dashed var(--line); }
  .checks { grid-template-columns: 1fr; }
  .month { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .month div:last-child { grid-column: 1 / -1; }
  .grid2 { grid-template-columns: 1fr; }
  .bills-ed .rowhead, .goals-ed .rowhead, .spend-ed .rowhead { display: none; }
  .bills-ed .erow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px; }
  .bills-ed .erow .n { grid-column: 1 / -1; }
  .goals-ed .erow, .spend-ed .erow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px; }
  .goals-ed .erow .n, .spend-ed .erow .n { grid-column: 1 / -1; }
  .erow { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
}
@media (prefers-reduced-motion: no-preference) { .bar span { transition: width .3s ease; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Clear <span>Payday</span></h1>
      <p class="label">Your money. Your paycheck. Your plan.</p>
    </div>
    <nav role="tablist" aria-label="Sections" id="nav">
      <button role="tab" data-tab="dash">Dashboard</button>
      <button role="tab" data-tab="pay">Paycheck</button>
      <button role="tab" data-tab="bills">Bills</button>
      <button role="tab" data-tab="spend">Spending</button>
      <button role="tab" data-tab="goals">Goals</button>
      <button role="tab" data-tab="backup">Backup</button>
    </nav>
  </header>

  <div class="banner" id="exampleBanner" hidden>
    <span id="bannerText"><b>You're looking at example numbers.</b> Clear them to set up your own plan.</span>
    <div class="row" id="bannerBtns">
      <button class="btn primary" id="clearExample">Start my own plan</button>
    </div>
  </div>

  <main id="view"></main>

  <footer>Your numbers are saved only in this browser on this device. Use Backup to move them to another device.</footer>
</div>

<script>
(function () {
  const KEY = "clearpayday.v1";
  const DAY = 86400000;
  const today = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

  // ---------- dates & money ----------
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();
  const fmtShort = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const fmtDay = d => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const r2 = n => Math.round(n * 100) / 100;
  const money = n => {
    const v = r2(n);
    return v.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);

  const FREQ = {
    weekly:   { label: "Weekly",        perYear: 52 },
    biweekly: { label: "Every 2 weeks", perYear: 26 },
    semi:     { label: "Twice a month", perYear: 24 },
    monthly:  { label: "Monthly",       perYear: 12 }
  };

  const KINDS = { save: "Savings", debt: "Debt payoff", trip: "Vacation", gift: "Gifts & occasions" };
  const isPlanned = g => g.kind === "trip" || g.kind === "gift";
  const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  function monthsUntil(by) {
    const m = /^(\d{4})-(\d{2})$/.exec(by || ""); if (!m) return 0;
    return Math.max(1, (+m[1] * 12 + (+m[2] - 1)) - (today.getFullYear() * 12 + today.getMonth()));
  }
  function goalMonthly(g) {
    if (isPlanned(g) && +g.target > 0 && monthsUntil(g.by)) return Math.ceil(+g.target / monthsUntil(g.by));
    return +g.amt || 0;
  }
  const spendMonthlyOf = () => state.spend.reduce((s, x) => s + (+x.amt || 0) * (x.per === "week" ? 52 / 12 : 1), 0);

  // ---------- state ----------
  function sample() {
    const toFri = (5 - today.getDay() + 7) % 7 || 7;
    return {
      example: true, freq: "biweekly", pay: 1850, next: iso(addDays(today, toFri)),
      bills: [
        { id: uid(), name: "Rent", amt: 1350, day: 1 },
        { id: uid(), name: "Internet", amt: 70, day: 8 },
        { id: uid(), name: "Car payment", amt: 385, day: 12 },
        { id: uid(), name: "Streaming", amt: 22.99, day: 15 },
        { id: uid(), name: "Phone", amt: 85, day: 18 },
        { id: uid(), name: "Electric", amt: 140, day: 22 },
        { id: uid(), name: "Car insurance", amt: 160, day: 27 }
      ],
      spend: [
        { id: uid(), name: "Groceries", amt: 120, per: "week" },
        { id: uid(), name: "Gas", amt: 45, per: "week" },
        { id: uid(), name: "Household & personal", amt: 80, per: "month" },
        { id: uid(), name: "Eating out", amt: 100, per: "month" }
      ],
      goals: [
        { id: uid(), name: "Emergency fund", amt: 200, kind: "save" },
        { id: uid(), name: "Credit card payoff", amt: 150, kind: "debt" },
        { id: uid(), name: "Summer trip", amt: 0, kind: "trip", target: 1200, by: ym(new Date(today.getFullYear(), today.getMonth() + 7, 1)) },
        { id: uid(), name: "Holiday gifts", amt: 0, kind: "gift", target: 600, by: ym(new Date(today.getFullYear(), today.getMonth() + 12, 1)) }
      ], cushion: 10, split: "balanced"
    };
  }
  const blank = () => ({ example: false, freq: "biweekly", pay: 0, next: "", bills: [], spend: [], goals: [] });

  function valid(s) {
    return s && typeof s === "object" && FREQ[s.freq] && Array.isArray(s.bills) && Array.isArray(s.goals);
  }
  let state;
  try { const raw = localStorage.getItem(KEY); state = raw ? JSON.parse(raw) : null; } catch (e) { state = null; }
  if (!valid(state)) state = sample();
  if (!Array.isArray(state.spend)) state.spend = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  let tab = "dash";

  // ---------- paycheck math ----------
  function stepFn(freq, anchorDay) {
    if (freq === "weekly") return d => addDays(d, 7);
    if (freq === "biweekly") return d => addDays(d, 14);
    if (freq === "semi") return d => d.getDate() < 15 ? new Date(d.getFullYear(), d.getMonth(), 15) : new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return d => { const y = d.getFullYear(), m = d.getMonth() + 1; return new Date(y, m, Math.min(anchorDay, dim(y, m))); };
  }
  function semiDays() {
    const a = +state.semiA || 1, b = +state.semiB || 15;
    return [Math.min(a, b), Math.max(a, b)];
  }
  function paydays(count) {
    if (state.freq === "semi") {
      const [a, b] = semiDays(); const out = [];
      for (let i = 0; out.length < count + 1 && i < 24; i++) {
        const y = today.getFullYear(), m = today.getMonth() + i;
        const yy = y + Math.floor(m / 12), mm = m % 12, last = dim(yy, mm);
        [a, b].forEach(day => { const d = new Date(yy, mm, Math.min(day, last)); if (d >= today && !out.some(x => +x === +d)) out.push(d); });
      }
      return out.slice(0, count + 1);
    }
    let d = parse(state.next);
    if (!d) return [];
    const step = stepFn(state.freq, d.getDate());
    let guard = 0;
    while (d < today && guard++ < 500) d = step(d);
    const out = [d];
    while (out.length < count + 1) out.push(step(out[out.length - 1]));
    return out;
  }
  function occurrences(bill, start, end) {
    const out = [];
    let y = start.getFullYear(), m = start.getMonth() - 1;
    for (let i = 0; i < 4; i++, m++) {
      const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
      const d = new Date(yy, mm, Math.min(Math.max(1, bill.day | 0), dim(yy, mm)));
      if (d >= start && d < end) out.push({ ...bill, date: d });
    }
    return out;
  }
  function plan() {
    const per = FREQ[state.freq].perYear;
    const count = state.freq === "weekly" ? 5 : 4;
    const days = paydays(count);
    const goalsMonthly = state.goals.reduce((s, g) => s + goalMonthly(g), 0);
    const goalsPer = r2(goalsMonthly * 12 / per);
    const spendMonthly = r2(state.spend.reduce((s, x) => s + (+x.amt || 0) * (x.per === "week" ? 52 / 12 : 1), 0));
    const spendPer = r2(spendMonthly * 12 / per);
    const checks = [];
    for (let i = 0; i < days.length - 1; i++) {
      const bills = state.bills.flatMap(b => occurrences(b, days[i], days[i + 1])).sort((a, b) => a.date - b.date);
      const billTotal = r2(bills.reduce((s, b) => s + (+b.amt || 0), 0));
      const left = r2((+state.pay || 0) - billTotal - spendPer - goalsPer);
      checks.push({ date: days[i], until: addDays(days[i + 1], -1), bills, billTotal, spendPer, goalsPer, left });
    }
    const beforeNext = days.length ? state.bills.flatMap(b => occurrences(b, today, days[0])).sort((a, b) => a.date - b.date) : [];
    const billsMonthly = r2(state.bills.reduce((s, b) => s + (+b.amt || 0), 0));
    const incomeMonthly = r2((+state.pay || 0) * per / 12);
    return { checks, beforeNext, goalsMonthly: r2(goalsMonthly), spendMonthly, billsMonthly, incomeMonthly, freeMonthly: r2(incomeMonthly - billsMonthly - spendMonthly - goalsMonthly) };
  }

  // ---------- views ----------
  const view = document.getElementById("view");

  function renderDash() {
    if (!(+state.pay > 0) || (state.freq !== "semi" && !parse(state.next))) {

    const c0 = p.checks[0];

      const tot = p.beforeNext.reduce((s, b) => s + (+b.amt || 0), 0);
      attn.push({ cls: "info", tag: "Before payday",
        text: `${p.beforeNext.map(b => `<b>${esc(b.name)}</b> (${money(b.amt)}, ${fmtShort(b.date)})`).join(", ")} ${p.beforeNext.length > 1 ? "are" : "is"} due before your ${fmtShort(c0.date)} paycheck. Keep ${money(tot)} in your account to cover ${p.beforeNext.length > 1 ? "them" : "it"}.` });
    }
    p.checks.forEach((c, i) => {
      if (c.left < 0) {
        const fromPrev = i > 0 && p.checks[i - 1].left + c.left >= 0;
        attn.push({ cls: "", tag: `Short ${fmtShort(c.date)}`,
          text: `Your ${fmtShort(c.date)} paycheck is <b>${money(-c.left)} short</b> of its bills, spending and goals.` +
            (i > 0 ? (fromPrev ? ` Set aside ${money(-c.left)} from your ${fmtShort(p.checks[i - 1].date)} paycheck to cover it.` : ` Your ${fmtShort(p.checks[i - 1].date)} paycheck can't fully cover it either, so look at moving a due date or trimming spending or a goal.`)
                   : ` Cover it from money already in your account, or move a due date.`) });
      }
    });
    const biggest = p.checks.reduce((a, c) => c.billTotal > a.billTotal ? c : a, p.checks[0]);
    if (!attn.some(a => a.cls === "") && biggest.billTotal > 0) {
      attn.push({ cls: "info", tag: "Heaviest check", text: `Your ${fmtShort(biggest.date)} paycheck carries the most bills (${money(biggest.billTotal)}). Everything is covered.` });
    }

    const scale = Math.max(+state.pay || 0, ...p.checks.map(c => c.billTotal + c.spendPer + c.goalsPer));
    const pct = n => Math.max(0, n) / scale * 100;

    const checkCard = (c, i) => {
      const over = Math.max(0, -c.left);
      const billsW = pct(Math.min(c.billTotal, +state.pay));
      const spendW = pct(Math.min(c.spendPer, Math.max(0, +state.pay - c.billTotal)));
      const goalsW = pct(Math.min(c.goalsPer, Math.max(0, +state.pay - c.billTotal - c.spendPer)));
      return `<article class="check">
        <div class="check-top">
          <div>
            <span class="label">Check ${i + 1} of ${p.checks.length}</span>

          <span style="width:${billsW}%;background:var(--bills)"></span>
          <span style="width:${spendW}%;background:var(--living)"></span>
          <span style="width:${goalsW}%;background:var(--goals)"></span>
          ${c.left > 0 ? `<span style="width:${pct(c.left)}%;background:var(--spend)"></span>` : ""}
          ${over ? `<span class="over" style="width:${pct(over)}%"></span>` : ""}
        </div>
        <div class="legend">
          <span><i class="dot" style="background:var(--bills)"></i>Bills ${money(c.billTotal)}</span>
          <span><i class="dot" style="background:var(--living)"></i>Spending ${money(c.spendPer)}</span>
          <span><i class="dot" style="background:var(--goals)"></i>Goals ${money(c.goalsPer)}</span>
        </div>
        <ul class="bill-list">
          ${c.bills.length ? c.bills.map(b => `<li><span class="d">${fmtShort(b.date)}</span><span>${esc(b.name || "Unnamed bill")}</span><span>${money(b.amt)}</span></li>`).join("")
            : `<li class="none">No bills due this period.</li>`}
        </ul>
      </article>`;
    };

          <div class="line-row"><span><i class="dot" style="background:var(--goals)"></i>Savings &amp; goals</span><b>−${money(c0.goalsPer)}</b></div>
          <div class="line-row total"><span><i class="dot" style="background:${short0 ? "var(--warn)" : "var(--spend)"}"></i>${short0 ? "Short" : "Left over"}</span><span>${short0 ? "−" : ""}${money(Math.abs(c0.left))}</span></div>

  function suggestion() {
    const per = FREQ[state.freq].perYear;
    const income = (+state.pay || 0) * per / 12;
    const bills = state.bills.reduce((s, b) => s + (+b.amt || 0), 0);
    const avail = r2(income - bills - spendMonthlyOf());
    const pctC = state.cushion ?? 10;
    const cushion = avail > 0 ? Math.round(avail * pctC / 100) : 0;
    const planned = state.goals.filter(isPlanned).reduce((s, g) => s + goalMonthly(g), 0);
    const rest = Math.max(0, Math.floor(avail - cushion - planned));
    const hasS = state.goals.some(g => g.kind === "save"), hasD = state.goals.some(g => g.kind === "debt");
    let share = { balanced: 0.5, debt: 0.3, savings: 0.7 }[state.split || "balanced"];
    if (!hasD) share = 1; else if (!hasS) share = 0;
    const save = Math.floor(rest * share), debt = rest - save;
    return { avail, cushion, pctC, planned, rest, save, debt, hasS, hasD };
  }
  function suggestBody() {
    const x = suggestion();
    if (!(+state.pay > 0)) return `<p class="note" style="margin:0">Add your paycheck first, and this will show what you can afford.</p>`;
    if (x.avail <= 0) return `<p class="warn" style="margin:0">Your bills and everyday spending add up to more than your income (${money(-x.avail)} over each month). Trim everyday spending before setting goals.</p>`;
    const over = x.avail - x.cushion - x.planned < 0;
    return `<p style="margin:0">After bills and everyday spending, you have <b>${money(x.avail)}</b> a month.</p>
      <div class="lines">
        <div class="line-row"><span>Cushion for surprises (${x.pctC}%)</span><b>${money(x.cushion)}</b></div>
        ${x.planned ? `<div class="line-row"><span>Vacation &amp; gifts you've planned</span><b>${money(x.planned)}</b></div>` : ""}
        <div class="line-row"><span>Savings${x.hasS ? "" : " (we'll add an emergency fund)"}</span><b>${money(x.save)}</b></div>
        ${x.hasD ? `<div class="line-row"><span>Debt payoff</span><b>${money(x.debt)}</b></div>` : ""}
      </div>
      ${over ? `<p class="warn" style="margin:0">Your vacation and gift plans need more than you have after the cushion. Push a date later or lower a target.</p>` : ""}
      ${x.rest > 0 ? `<div><button class="btn primary" id="applySuggest">Use these amounts</button></div>` : ""}`;
  }

  function renderGoals() {

          <div class="opt"><span class="label">Priority</span><div class="chips">${[["balanced", "Balanced"], ["debt", "Pay off debt first"], ["savings", "Build savings first"]].map(([v, l]) => chip("split", v, l, state.split || "balanced")).join("")}</div></div>

        ${state.goals.map(g => {
          const auto = isPlanned(g) && +g.target > 0 && monthsUntil(g.by);
          return `<div class="erow" data-id="${g.id}">
          <input class="n" type="text" id="goal-name-${g.id}" data-f="name" value="${esc(g.name)}" placeholder="Goal name" aria-label="Goal name">
          <div class="money"><input type="number" id="goal-amt-${g.id}" data-f="amt" min="0" step="0.01" inputmode="decimal" value="${auto ? goalMonthly(g) : (g.amt || "")}" placeholder="0" aria-label="Monthly amount" ${auto ? "readonly" : ""}></div>
          <select id="goal-kind-${g.id}" data-f="kind" aria-label="Type">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}" ${g.kind === k ? "selected" : ""}>${l}</option>`).join("")}</select>

            <span>Save up</span>

        ${state.goals.length ? "" : `<p class="note" style="margin:0">No goals yet. Even $25 a month toward an emergency fund counts.</p>`}
      </div>
      <div class="ed-foot">

  function dayOpts(sel) { return Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${+sel === i + 1 ? "selected" : ""}>${i === 30 ? "31st / last day" : ordinal(i + 1)}</option>`).join(""); }
  function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function encode() { return "CP1:" + btoa(unescape(encodeURIComponent(JSON.stringify({ ...state, example: false })))); }
  function decode(code) {
    const s = code.trim().replace(/^CP1:/, "");
    const obj = JSON.parse(decodeURIComponent(escape(atob(s))));
    if (!valid(obj)) throw new Error("bad");
    return obj;
  }

  // ---------- render & events ----------
  function render() {

  function go(t) { tab = t; render(); window.scrollTo({ top: 0 }); }
  function touched() { if (state.example) { state.example = false; document.getElementById("exampleBanner").hidden = true; } save(); }

  document.getElementById("nav").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });

  // Inline confirm for clearing examples
  const bannerBtns = document.getElementById("bannerBtns");
  const bannerText = document.getElementById("bannerText");
  bannerBtns.addEventListener("click", e => {
    const id = e.target.id;
    if (id === "clearExample") {
      bannerText.innerHTML = "<b>Clear the example numbers?</b> You'll start with an empty plan.";
      bannerBtns.innerHTML = `<button class="btn primary" id="confirmClear">Yes, clear them</button><button class="btn ghost" id="cancelClear">Keep examples</button>`;
    } else if (id === "confirmClear") {
      state = blank(); save(); resetBanner(); go("pay");
    } else if (id === "cancelClear") resetBanner();

  function resetBanner() {
    bannerText.innerHTML = "<b>You're looking at example numbers.</b> Clear them to set up your own plan.";
    bannerBtns.innerHTML = `<button class="btn primary" id="clearExample">Start my own plan</button>`;
  }

  view.addEventListener("click", e => {
    const t = e.target;
    const goBtn = t.closest("[data-go]"); if (goBtn) return go(goBtn.dataset.go);
    if (t.id === "addBill") { state.bills.push({ id: uid(), name: "", amt: 0, day: 1 }); touched(); render(); const r = view.querySelectorAll(".erow"); r[r.length - 1]?.querySelector("input")?.focus(); return; }
    if (t.id === "addSpend") { state.spend.push({ id: uid(), name: "", amt: 0, per: "month" }); touched(); render(); const r = view.querySelectorAll(".erow"); r[r.length - 1]?.querySelector("input")?.focus(); return; }
    if (t.id === "applySuggest") {
      const x = suggestion();
      let saves = state.goals.filter(g => g.kind === "save");
      if (!saves.length && x.save > 0) { state.goals.unshift({ id: uid(), name: "Emergency fund", amt: 0, kind: "save" }); saves = [state.goals[0]]; }
      const debts = state.goals.filter(g => g.kind === "debt");
      const spread = (list, total) => list.forEach((g, i) => { g.amt = Math.floor(total / list.length) + (i === 0 ? total % list.length : 0); });
      if (saves.length) spread(saves, x.save);
      if (debts.length) spread(debts, x.debt);
      touched(); render(); return;
    }
    if (t.id === "addGoal") { state.goals.push({ id: uid(), name: "", amt: 0, kind: "save" }); touched(); render(); const r = view.querySelectorAll(".erow"); r[r.length - 1]?.querySelector("input")?.focus(); return; }
    const del = t.closest("[data-del]");
    if (del) { const id = del.closest(".erow").dataset.id; const list = { bill: "bills", spend: "spend", goal: "goals" }[del.dataset.del]; state[list] = state[list].filter(x => x.id !== id); touched(); render(); return; }
    if (t.id === "copyBackup") {
      const ta = document.getElementById("backupOut"), msg = document.getElementById("copyMsg");
      const fallback = () => { ta.focus(); ta.select(); msg.className = "msg"; msg.textContent = "Selected. Copy it with your device's copy command."; };
      try { navigator.clipboard.writeText(ta.value).then(() => { msg.className = "msg ok"; msg.textContent = "Copied."; }, fallback); } catch (err) { fallback(); }
      return;
    }
    if (t.id === "restoreBtn") {
      const msg = document.getElementById("restoreMsg");
      try { state = decode(document.getElementById("restoreIn").value); save(); msg.className = "msg ok"; msg.textContent = "Restored."; setTimeout(() => go("dash"), 600); }
      catch (err) { msg.className = "msg bad"; msg.textContent = "That code didn't work. Make sure you pasted the whole thing, starting with CP1:"; }
    }
  });

  view.addEventListener("input", e => {
    const t = e.target;
    if (t.name === "freq") { state.freq = t.value; touched(); render(); document.getElementById("freq-" + t.value)?.focus(); return; }
    else if (t.name === "cushion") state.cushion = +t.value;
    else if (t.name === "split") state.split = t.value;
    else if (t.id === "semi-a") state.semiA = +t.value;
    else if (t.id === "semi-b") state.semiB = +t.value;
    else if (t.id === "pay-amt") state.pay = parseFloat(t.value) || 0;
    else if (t.id === "pay-next") state.next = t.value;
    else if (t.dataset.f) {
      const row = t.closest(".erow"); const list = row.closest(".bills-ed") ? state.bills : row.closest(".spend-ed") ? state.spend : state.goals;
      const item = list.find(x => x.id === row.dataset.id); if (!item) return;
      item[t.dataset.f] = (t.dataset.f === "amt" || t.dataset.f === "target") ? (parseFloat(t.value) || 0) : t.dataset.f === "day" ? +t.value : t.value;
      if (list === state.goals) {
        if (t.dataset.f === "kind") { touched(); render(); document.getElementById("goal-kind-" + item.id)?.focus(); return; }
        const auto = isPlanned(item) && +item.target > 0 && monthsUntil(item.by);
        const amtEl = document.getElementById("goal-amt-" + item.id);
        if (amtEl && t !== amtEl) { amtEl.readOnly = !!auto; if (auto) amtEl.value = goalMonthly(item); }
        const calc = document.getElementById("goal-calc-" + item.id);
        if (calc) calc.textContent = auto ? `${money(goalMonthly(item))}/mo for ${monthsUntil(item.by)} mo` : "";
      }
    } else return;
    touched();
    const pm = document.getElementById("payMonthly"); if (pm) pm.textContent = money((+state.pay || 0) * FREQ[state.freq].perYear / 12);
    const bt = document.getElementById("billTotal"); if (bt) bt.textContent = money(state.bills.reduce((s, b) => s + (+b.amt || 0), 0));
    const st = document.getElementById("spendTotal"); if (st) st.textContent = money(state.spend.reduce((s, x) => s + (+x.amt || 0) * (x.per === "week" ? 52 / 12 : 1), 0));
    const gt = document.getElementById("goalTotal"); if (gt) gt.textContent = money(state.goals.reduce((s, g) => s + goalMonthly(g), 0));
    const sb = document.getElementById("suggestBody"); if (sb) sb.innerHTML = suggestBody();
  });

  render();
})();
</script>
